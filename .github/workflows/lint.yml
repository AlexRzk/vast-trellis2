name: lint

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          bash -n install.sh vast-trellis2 vast-trellis2-doctor
          bash -n lib/common.sh lib/install.sh lib/runtime.sh
      - name: Python syntax
        run: python -m py_compile scripts/*.py
      - name: ShellCheck
        run: shellcheck -x install.sh vast-trellis2 vast-trellis2-doctor lib/*.sh
